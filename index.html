<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Salão de beleza premium especializado em transformação capilar, loiros perfeitos, terapia capilar e autoestima. Mais de 500 clientes satisfeitas.">

    <title>Seu Cabelo Merece Mais - Salão de Beleza Premium</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- AOS Animations -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a1a1a;
            --secondary: #d4af37;
            --accent: #f5f1e8;
            --champagne: #f5e6d3;
            --text-dark: #2d2d2d;
            --text-light: #ffffff;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-dark);
            background: var(--accent);
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.7) 0%, rgba(26, 26, 26, 0.5) 100%), 
                        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><defs><pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="2" fill="%23d4af37" opacity="0.3"/></pattern></defs><rect width="1200" height="800" fill="%231a1a1a"/><rect width="1200" height="800" fill="url(%23dots)"/></svg>');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .hero-content {
            text-align: center;
            color: var(--text-light);
            z-index: 10;
            max-width: 800px;
            padding: 20px;
            animation: fadeInUp 1s ease-out;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -1px;
            line-height: 1.2;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .hero p {
            font-size: 1.3rem;
            margin-bottom: 40px;
            color: var(--champagne);
            font-weight: 300;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
        }

        .hero-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--secondary) 0%, #e5c158 100%);
            color: var(--primary);
            padding: 16px 40px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-light);
            padding: 16px 40px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            border: 2px solid var(--secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-secondary:hover {
            background: var(--secondary);
            color: var(--primary);
            transform: translateY(-3px);
        }

        /* Scroll Indicator */
        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            z-index: 10;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(10px); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Social Proof Bar */
        .social-proof {
            background: linear-gradient(90deg, var(--primary) 0%, rgba(26, 26, 26, 0.95) 100%);
            padding: 30px 20px;
            color: var(--text-light);
            text-align: center;
        }

        .social-proof-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .proof-item {
            padding: 20px;
        }

        .proof-item .stars {
            color: var(--secondary);
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .proof-item h3 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .proof-item p {
            font-size: 0.9rem;
            color: var(--champagne);
        }

        /* Sections */
        section {
            padding: 80px 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .section-title p {
            font-size: 1.1rem;
            color: #666;
            max-width: 600px;
            margin: 0 auto;
        }

        .title-underline {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--secondary) 0%, transparent 100%);
            margin: 20px auto 0;
        }

        /* Transformations Section */
        .transformations {
            background: linear-gradient(135deg, var(--accent) 0%, #ffffff 100%);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .transformation-card {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .transformation-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.2);
        }

        .transformation-card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .transformation-card:hover img {
            transform: scale(1.05);
        }

        .transformation-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(26, 26, 26, 0.9) 100%);
            padding: 30px 20px 20px;
            color: var(--text-light);
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        .transformation-card:hover .transformation-overlay {
            transform: translateY(0);
        }

        .transformation-overlay h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .transformation-overlay p {
            font-size: 0.9rem;
            color: var(--champagne);
        }

        /* Services Section */
        .services {
            background: linear-gradient(135deg, #ffffff 0%, var(--accent) 100%);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .service-card {
            background: var(--text-light);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            border-top: 4px solid var(--secondary);
        }

        .service-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 20px 50px rgba(212, 175, 55, 0.15);
        }

        .service-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .service-content {
            padding: 30px;
        }

        .service-content h3 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--primary);
        }

        .service-content p {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .service-price {
            color: var(--secondary);
            font-weight: 700;
            font-size: 1.2rem;
        }

        /* Differentials Section */
        .differentials {
            background: linear-gradient(135deg, var(--primary) 0%, #2d2d2d 100%);
            color: var(--text-light);
        }

        .differentials .section-title h2,
        .differentials .section-title p {
            color: var(--text-light);
        }

        .differentials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .differential-item {
            text-align: center;
            padding: 30px;
        }

        .differential-item i {
            font-size: 3rem;
            color: var(--secondary);
            margin-bottom: 20px;
            display: block;
        }

        .differential-item h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .differential-item p {
            color: var(--champagne);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Testimonials Section */
        .testimonials {
            background: linear-gradient(135deg, var(--accent) 0%, #ffffff 100%);
        }

        .testimonial-carousel {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .testimonial-card {
            background: var(--text-light);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .testimonial-card.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .testimonial-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 20px;
            object-fit: cover;
            border: 3px solid var(--secondary);
        }

        .testimonial-stars {
            color: var(--secondary);
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .testimonial-text {
            font-size: 1rem;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.8;
            font-style: italic;
        }

        .testimonial-name {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .carousel-controls {
            text-align: center;
            margin-top: 30px;
        }

        .carousel-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ddd;
            display: inline-block;
            margin: 0 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .carousel-dot.active {
            background: var(--secondary);
            width: 30px;
            border-radius: 6px;
        }

        /* Why Choose Section */
        .why-choose {
            background: linear-gradient(135deg, #ffffff 0%, var(--accent) 100%);
        }

        .why-choose-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: center;
        }

        .why-choose-content h3 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--primary);
        }

        .why-choose-item {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .why-choose-item i {
            font-size: 1.5rem;
            color: var(--secondary);
            flex-shrink: 0;
            margin-top: 5px;
        }

        .why-choose-item h4 {
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--primary);
        }

        .why-choose-item p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .why-choose-image {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .why-choose-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Booking Section */
        .booking {
            background: linear-gradient(135deg, var(--primary) 0%, #2d2d2d 100%);
            color: var(--text-light);
        }

        .booking .section-title h2,
        .booking .section-title p {
            color: var(--text-light);
        }

        .booking-form {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder,
        .form-group select {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .form-group select option {
            background: var(--primary);
            color: var(--text-light);
        }

        .booking-form button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--secondary) 0%, #e5c158 100%);
            color: var(--primary);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .booking-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }

        /* Map Section */
        .map-section {
            background: var(--accent);
            padding: 60px 20px;
        }

        .map-container {
            max-width: 1200px;
            margin: 0 auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            height: 500px;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* FAQ Section */
        .faq {
            background: linear-gradient(135deg, #ffffff 0%, var(--accent) 100%);
        }

        .faq-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .faq-item {
            background: var(--text-light);
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        .faq-item:hover {
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.1);
        }

        .faq-question {
            padding: 25px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--text-light);
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .faq-question:hover {
            background: var(--accent);
            border-left-color: var(--secondary);
        }

        .faq-question h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            margin: 0;
        }

        .faq-question i {
            color: var(--secondary);
            transition: transform 0.3s ease;
        }

        .faq-question.active i {
            transform: rotate(180deg);
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            padding: 0 25px;
        }

        .faq-answer.active {
            max-height: 500px;
            padding: 0 25px 25px;
        }

        .faq-answer p {
            color: #666;
            line-height: 1.8;
            margin: 0;
        }

        /* CTA Final Section */
        .cta-final {
            background: linear-gradient(135deg, var(--primary) 0%, #1a1a1a 50%, var(--secondary) 100%);
            color: var(--text-light);
            padding: 100px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
